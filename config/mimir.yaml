multitenancy_enabled: false

common:
  storage:
    backend: local
    local:
      directory: /tmp/mimir

blocks_storage:
  backend: local
  local:
    directory: /tmp/mimir/blocks
  tsdb:
    dir: /tmp/mimir/tsdb

compactor:
  data_dir: /tmp/mimir/compactor

ingester:
  ring:
    replication_factor: 1
    instance_id: ingress-1
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist

store_gateway:
  sharding_ring:
    replication_factor: 1
